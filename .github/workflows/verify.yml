name: verify

# 유일한 차단 게이트다 (docs/RELIABILITY.md).
# 게이트를 늘리기 전에 정말 필요한지 먼저 물어라.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # 아직 lock 파일이 없는 부트스트랩 이전 단계에서도 동작한다
      - name: Install
        run: npm ci || npm install

      - name: Verify (typecheck · lint · arch · docs · test)
        run: npm run verify
